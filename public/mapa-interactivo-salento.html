<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa interactivo de Salento, Quindío | Salento a la Mano</title>
    <meta name="description" content="Consulta el mapa turístico interactivo de Salento para ubicar alojamientos, restaurantes, cafés, experiencias, transporte y servicios locales.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://www.salentoalamano.com/mapa-interactivo-salento">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/page-theme.css">
    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebPage", "name": "Mapa interactivo de Salento, Quindío | Salento a la Mano", "description": "Consulta el mapa turístico interactivo de Salento para ubicar alojamientos, restaurantes, cafés, experiencias, transporte y servicios locales.", "url": "https://www.salentoalamano.com/mapa-interactivo-salento", "inLanguage": "es-CO", "isPartOf": {"@type": "WebSite", "name": "Salento a la Mano", "url": "https://www.salentoalamano.com/"}}</script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #f5f1e8; color: #272d25; }
      .map-header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e4dfd2; position: relative; z-index: 1000; }
      .map-header a { color: #3d7a47; text-decoration: none; font-weight: 600; font-size: 14px; }
      .map-header h1 { font-family: 'Fraunces', serif; font-size: 20px; margin: 4px 0 8px; }
      .map-filters { display: flex; flex-wrap: wrap; gap: 6px; }
      .map-filters button { padding: 5px 12px; border-radius: 20px; border: 1.5px solid #d6d1c4; background: #fff; font-size: 12px; cursor: pointer; transition: all 0.2s; }
      .map-filters button.active, .map-filters button:hover { background: #3d7a47; color: #fff; border-color: #3d7a47; }
      #map { width: 100%; height: calc(100vh - 140px); }
      .leaflet-popup-content { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; line-height: 1.5; }
      .leaflet-popup-content strong { font-family: 'Fraunces', serif; font-size: 15px; display: block; margin-bottom: 4px; }
      .popup-type { color: #70796e; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
      .popup-btn { display: inline-block; margin-top: 8px; padding: 6px 14px; background: #3d7a47; color: #fff; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; }
      .popup-btn:hover { background: #2f5e38; }
      .back-float { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #fff; border-radius: 50%; width: 48px; height: 48px; display: grid; place-items: center; box-shadow: 0 2px 12px rgba(0,0,0,0.15); border: none; cursor: pointer; font-size: 20px; }
      .back-float:hover { background: #f0ede4; }
      @media (max-width: 600px) {
        .map-header h1 { font-size: 17px; }
        #map { height: calc(100vh - 160px); }
      }
    </style>
  </head>
  <body>
    <div class="map-header">
      <a href="/">← Salento a la Mano</a>
      <h1>Mapa interactivo de Salento</h1>
      <div class="map-filters">
        <button class="active" data-filter="all">Todos</button>
        <button data-filter="Alojamientos">Alojamientos</button>
        <button data-filter="Restaurantes">Restaurantes</button>
        <button data-filter="Restaurante Bar">Bar</button>
        <button data-filter="Coffee Tours">Coffee Tours</button>
        <button data-filter="Experiencias">Experiencias</button>
        <button data-filter="Eventos">Eventos</button>
        <button data-filter="Servicios">Servicios</button>
        <button data-filter="Camping">Camping</button>
      </div>
    </div>
    <div id="map"></div>
    <a href="/" class="back-float" aria-label="Volver al inicio">←</a>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      (async function() {
        const res = await fetch('/data/places.json');
        const data = await res.json();
        const places = data.places || [];

        const typeColors = {
          'Alojamientos': '#56755b',
          'Restaurantes': '#e76c52',
          'Restaurante Bar': '#e8bb58',
          'Cafés': '#8b6f47',
          'Coffee Tours': '#8b6f47',
          'Artesanías': '#e8bb58',
          'Tiendas': '#7898a8',
          'Experiencias': '#9b7bb5',
          'Eventos': '#9b7bb5',
          'Atractivos Turísticos': '#56755b',
          'Servicios': '#56755b',
          'Camping': '#d4a373'
        };

        const slugify = (name) => name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

        const map = L.map('map').setView([4.6371, -75.5706], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 18
        }).addTo(map);

        const markers = [];

        function renderMarkers(filter) {
          markers.forEach(m => map.removeLayer(m.marker));
          markers.length = 0;

          const filtered = filter === 'all' ? places : places.filter(p => p.type === filter);

          filtered.forEach(place => {
            if (!place.location || !place.location.lat || !place.location.lng) return;
            const color = typeColors[place.type] || '#3d7a47';
            const marker = L.circleMarker([place.location.lat, place.location.lng], {
              radius: 9,
              fillColor: color,
              color: '#fff',
              weight: 2,
              fillOpacity: 0.9
            }).addTo(map);

            const slug = slugify(place.name);
            const slugPath = (place.type === 'Alojamientos' || place.type === 'Restaurantes' || place.type === 'Restaurante Bar' || place.type === 'Cafés' || place.type === 'Coffee Tours' || place.type === 'Artesanías' || place.type === 'Tiendas' || place.type === 'Experiencias' || place.type === 'Eventos' || place.type === 'Servicios' || place.type === 'Camping')
              ? '/paginas-pautantes/' + slug + '/'
              : '#';

            const popupHtml = '<strong>' + place.name + '</strong>'
              + '<span class="popup-type">' + place.type + '</span>'
              + '<br>' + (place.description ? place.description.substring(0, 100) + '...' : '')
              + (place.location.address ? '<br><small>' + place.location.address + '</small>' : '')
              + '<br><a class="popup-btn" href="' + slugPath + '">Ver ficha</a>';

            marker.bindPopup(popupHtml, { maxWidth: 260 });
            markers.push({ marker, type: place.type });
          });
        }

        renderMarkers('all');

        document.querySelectorAll('.map-filters button').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.map-filters button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderMarkers(this.dataset.filter);
          });
        });
      })();
    </script>
  </body>
</html>
