<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="offlineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="45" fill="url(#offlineGradient)"/>
  
  <!-- Icono de WIFI tachado -->
  <path d="M50 65 L50 65" 
        stroke="white" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Ondas de wifi -->
  <path d="M30 50 Q50 30 70 50" 
        fill="none" 
        stroke="white" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <path d="M35 55 Q50 40 65 55" 
        fill="none" 
        stroke="white" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <path d="M40 60 Q50 50 60 60" 
        fill="none" 
        stroke="white" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Línea tachando -->
  <line x1="25" y1="75" x2="75" y2="25" 
        stroke="white" 
        stroke-width="5" 
        stroke-linecap="round"/>
  
  <!-- Texto -->
  <text x="50" y="90" 
        font-family="Arial, sans-serif" 
        font-size="10" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">OFFLINE</text>
</svg>
