<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="45" fill="url(#chatGradient)"/>
  
  <!-- Burbuja de chat -->
  <rect x="25" y="25" width="50" height="35" rx="8" fill="white"/>
  
  <!-- Puntero de burbuja -->
  <path d="M35 60 L30 75 L45 60" fill="white"/>
  
  <!-- Líneas de texto -->
  <line x1="35" y1="38" x2="65" y2="38" stroke="#38a169" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="48" x2="55" y2="48" stroke="#38a169" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Puntos de mensaje -->
  <circle cx="62" cy="70" r="3" fill="white"/>
  <circle cx="50" cy="70" r="3" fill="white"/>
  <circle cx="38" cy="70" r="3" fill="white"/>
</svg>
