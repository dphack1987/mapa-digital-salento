<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="verifyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="45" fill="url(#verifyGradient)"/>
  
  <!-- Círculo interior -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Checkmark -->
  <path d="M35 50 L45 60 L65 35" 
        fill="none" 
        stroke="white" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Estrellas decorativas -->
  <circle cx="25" cy="30" r="2" fill="#FFD700"/>
  <circle cx="75" cy="30" r="2" fill="#FFD700"/>
  <circle cx="25" cy="70" r="2" fill="#FFD700"/>
  <circle cx="75" cy="70" r="2" fill="#FFD700"/>
</svg>
