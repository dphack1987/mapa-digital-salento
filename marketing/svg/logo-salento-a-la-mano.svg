<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5c2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d8a4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo del logo -->
  <rect x="0" y="10" width="100" height="80" rx="10" fill="url(#greenGradient)"/>
  
  <!-- Icono de mapa -->
  <path d="M30 35 L50 25 L70 35 L70 75 L50 85 L30 75 Z" 
        fill="none" 
        stroke="#FFD700" 
        stroke-width="3"/>
  
  <!-- Pin del mapa -->
  <circle cx="50" cy="50" r="8" fill="#FFD700"/>
  <circle cx="50" cy="50" r="4" fill="#1a5c2e"/>
  
  <!-- Texto del logo -->
  <text x="115" y="45" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="#1a5c2e">Salento</text>
  
  <text x="115" y="75" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        fill="#2d8a4e">a la Mano</text>
  
  <!-- Línea decorativa -->
  <line x1="115" y1="50" x2="280" y2="50" 
        stroke="#FFD700" 
        stroke-width="2" 
        opacity="0.5"/>
</svg>
