<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Escudo -->
  <path d="M100 10 L180 50 L180 100 Q180 160 100 190 Q20 160 20 100 L20 50 Z" 
        fill="url(#shieldGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Borde interior -->
  <path d="M100 20 L170 55 L170 100 Q170 155 100 180 Q30 155 30 100 L30 55 Z" 
        fill="none" 
        stroke="white" 
        stroke-width="2"
        opacity="0.3"/>
  
  <!-- Checkmark -->
  <path d="M60 100 L90 130 L140 70" 
        fill="none" 
        stroke="white" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Texto -->
  <text x="100" y="155" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="2">VERIFICADO</text>
</svg>
