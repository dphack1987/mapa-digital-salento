<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1.0">
  <title>WhatsApp Status - Lanzamiento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1920px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    
    .status {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #075e54 0%, #128c7e 50%, #25d366 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 60px;
      text-align: center;
    }
    
    .logo-container {
      margin-bottom: 60px;
    }
    
    .logo {
      width: 200px;
      height: 200px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    
    .title {
      font-size: 80px;
      font-weight: 900;
      color: white;
      line-height: 1.1;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .subtitle {
      font-size: 40px;
      color: rgba(255,255,255,0.9);
      margin-bottom: 60px;
      max-width: 900px;
    }
    
    .checklist {
      width: 100%;
      max-width: 900px;
    }
    
    .check-item {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 32px 40px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.3);
    }
    
    .check-icon {
      width: 60px;
      height: 60px;
      background: #FFD700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #075e54;
      font-weight: bold;
      flex-shrink: 0;
    }
    
    .check-text {
      color: white;
      font-size: 36px;
      text-align: left;
    }
    
    .url-box {
      margin-top: 60px;
      background: white;
      color: #075e54;
      padding: 32px 60px;
      border-radius: 50px;
      font-size: 36px;
      font-weight: bold;
    }
    
    .footer-text {
      margin-top: 40px;
      color: rgba(255,255,255,0.7);
      font-size: 28px;
    }
  </style>
</head>
<body>
  <div class="status">
    <div class="logo-container">
      <div class="logo">🌿</div>
    </div>
    
    <h1 class="title">SALENTO<br>ESTÁ ABIERTO</h1>
    
    <p class="subtitle">Tu guía oficial con información VERIFICADA en tiempo real</p>
    
    <div class="checklist">
      <div class="check-item">
        <div class="check-icon">✓</div>
        <div class="check-text">Vías libres y en buen estado</div>
      </div>
      <div class="check-item">
        <div class="check-icon">✓</div>
        <div class="check-text">Hoteles operativos con disponibilidad</div>
      </div>
      <div class="check-item">
        <div class="check-icon">✓</div>
        <div class="check-text">Valle de Cocora 100% accesible</div>
      </div>
      <div class="check-item">
        <div class="check-icon">✓</div>
        <div class="check-text">Turismo seguro y normal</div>
      </div>
    </div>
    
    <div class="url-box">salentoalamano.com</div>
    
    <p class="footer-text">Comparte con amigos que planean visitar Salento 🌿</p>
  </div>
</body>
</html>
