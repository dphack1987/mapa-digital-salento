name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (no bloquea deploy; deuda TS en seguimiento)
        run: npm run type-check
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Copy CNAME to dist (dominio personalizado desde raíz)
        run: cp CNAME dist/

      - name: Ensure 404.html has noindex (not a copy of homepage)
        run: |
          if [ -f "public/404.html" ]; then
            cp public/404.html dist/404.html
          else
            cat > dist/404.html << 'EOF'
          <!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="canonical" href="https://www.salentoalamano.com/"><title>Página no encontrada</title></head><body><h1>404</h1><p><a href="/">Volver al inicio</a></p></body></html>
          EOF
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the dist folder (built files)
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5